[workspace]
members = [
    "dpedal_flash",
    "dpedal_config",
    "site",
]
exclude = [
    "dpedal_firmware",
    "dpedal_config_web_app"
]
resolver = "2"


[workspace.dependencies]
heapless = { version = "0.8", default-features = false, features = ["serde"] }

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"

[profile.release]
lto = true
incremental = false
opt-level = "z"
debug = true

[profile.dev]
opt-level = "z"

